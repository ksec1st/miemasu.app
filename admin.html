<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教員用管理画面｜京都翔英高校 OC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="brand">個別相談｜教員管理</div>
      <div class="header-sub">STAFF MANAGEMENT</div>
    </div>
    <nav>
      <a href="index.html">案内画面</a>
      <a href="visitor.html">番号確認</a>
    </nav>
  </header>

  <main>
    <h1>教員用管理画面</h1>
    <p class="muted">受付番号の発行、呼び出し、ブース管理を行います。</p>

    <section class="card" id="loginCard">
      <h2>教員ログイン</h2>
      <div class="form-row">
        <label for="pin">教員PIN</label>
        <input id="pin" type="password" inputmode="numeric"
          autocomplete="current-password" placeholder="教員PINを入力">
      </div>
      <button class="btn" id="loginBtn" type="button">ログイン</button>
      <div class="message" id="loginMessage" role="status"></div>
    </section>

    <div id="adminPanel" hidden>
      <section class="card" style="margin-top:20px">
        <h2>来客者を登録</h2>
        <div class="form-row">
          <label for="registerBooth">相談ブース</label>
          <select id="registerBooth">
            <option>A</option><option>B</option><option>C</option>
            <option>D</option><option>E</option><option>F</option>
          </select>
        </div>
        <button class="btn" id="registerBtn" type="button">受付番号を発行</button>
        <div class="message" id="registerMessage" role="status"></div>
      </section>

      <section style="margin-top:24px">
        <h2>ブース管理</h2>
        <div class="admin-grid" id="adminBooths"></div>
      </section>

      <section class="card" style="margin-top:24px">
        <h2>相談予約一覧</h2>
        <p class="muted small">開始予定時刻は各来客者ごとに変更できます。</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>番号</th><th>ブース</th><th>開始予定</th>
                <th>状態</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="ticketRows"></tbody>
          </table>
        </div>
        <div class="actions">
          <button class="btn secondary" id="reloadBtn" type="button">最新情報に更新</button>
          <button class="btn danger" id="closeDayBtn" type="button">全ブースを本日なしにする</button>
        </div>
        <div class="message" id="adminMessage" role="status"></div>
      </section>

      <div class="actions">
        <button class="btn secondary" id="logoutBtn" type="button">ログアウト</button>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
